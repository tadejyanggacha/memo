<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상담 메모</title>
<style>
  :root{
    --bg:#EDF1F2; --ink:#14272E; --sub:#5B6E75; --teal:#0F5B66; --teal-d:#0A434B;
    --rec:#B93A2A; --off:#CBD5D8; --off-ink:#7C8D93; --card:#FFFFFF; --ok:#1F7A4D;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:16px}
  .who{display:flex;gap:14px;align-items:center;background:var(--card);border-left:6px solid var(--off);border-radius:6px;padding:14px 16px;margin-bottom:12px;min-height:84px}
  .who.on{border-left-color:var(--teal)}
  .who.rec{border-left-color:var(--rec)}
  .who img{width:56px;height:56px;object-fit:cover;border-radius:4px;display:none}
  .who b{display:block;font-size:20px;line-height:1.3}
  .who small{color:var(--sub);font-size:13px}
  .msg{min-height:20px;font-size:14px;color:var(--sub);margin:0 2px 10px}
  .msg.err{color:#fff;background:var(--rec);padding:10px 12px;border-radius:6px;font-weight:600;line-height:1.5}
  button.big{display:block;width:100%;height:76px;margin-bottom:12px;border:0;border-radius:10px;font-weight:700;font-size:20px;font-family:inherit;background:var(--teal);color:#fff}
  button.big:active:not(:disabled){background:var(--teal-d)}
  button.big:disabled{background:var(--off);color:var(--off-ink)}
  button.big.stop{background:var(--rec)}
  button.big.stop:disabled{background:var(--off)}
  button.big.ghost{background:var(--card);color:var(--teal);border:2px solid var(--teal)}
  button.big.ghost:disabled{background:transparent;border-color:var(--off);color:var(--off-ink)}
  button:focus-visible{outline:3px solid #7FB7C0;outline-offset:2px}
  .hide{display:none}
  #jobs{margin-top:4px}
  .job{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:15px}
  .job .t{color:var(--sub);font-size:13px;min-width:44px}
  .job.run .x{color:var(--sub)}
  .job.ok .x{color:var(--ok);font-weight:600}
  .job.err .x{color:var(--rec);font-weight:600;word-break:break-all}
  .job button{margin-left:auto;border:1px solid var(--teal);background:none;color:var(--teal);border-radius:6px;padding:6px 10px;font-family:inherit;font-weight:600}
  .item{display:flex;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:8px;padding:16px;margin-bottom:8px;font-weight:600;font-size:18px;font-family:inherit;color:var(--ink)}
  .item .n{min-width:28px;color:var(--teal);font-weight:700}
  .item .t{margin-left:auto;color:var(--sub);font-weight:400;font-size:14px}
  .note{background:var(--card);border-radius:8px;padding:18px;white-space:pre-wrap;line-height:1.7;font-size:16px}
  .note h2{margin:0 0 12px;font-size:22px}
  .back{background:none;border:0;color:var(--teal);font-weight:600;font-size:16px;font-family:inherit;padding:8px 0;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap">

  <div id="main">
    <div class="who" id="who">
      <img id="thumb" alt="접수증">
      <div><b id="whoText">접수증을 촬영하세요</b><small id="whoSub"></small></div>
    </div>
    <p class="msg" id="msg"></p>
    <input type="file" id="file" accept="image/*" capture="environment" class="hide">
    <button class="big" id="b1">접수증 촬영</button>
    <button class="big" id="b2" disabled>CONSULT 시작</button>
    <button class="big stop" id="b3" disabled>CONSULT 종료</button>
    <button class="big ghost" id="b4">내역 보기</button>
    <div id="jobs"></div>
  </div>

  <div id="list" class="hide">
    <button class="back" id="back1">← 메인</button>
    <div id="items"></div>
  </div>

  <div id="detail" class="hide">
    <button class="back" id="back2">← 목록</button>
    <div class="note"><h2 id="dName"></h2><div id="dText"></div></div>
  </div>

</div>
<script>
/* Apps Script 웹앱 주소 */
const API_URL = 'https://script.google.com/macros/s/AKfycbyKxxGAmM_D88j2XWDOhicUF7vvJ0HoYBBLj2sQqwh9q3a-KYOPJ0fGva5pcQuDdxc7/exec';

function getToken(){
  let t=''; try{ t=localStorage.getItem('tok')||''; }catch(e){}
  if(!t){ t=(prompt('접속 토큰을 입력하세요 (처음 한 번만)')||'').trim(); try{ localStorage.setItem('tok',t); }catch(e){} }
  return t;
}
async function apiCall(fn,args){
  const res = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:getToken(),fn:fn,args:args})});
  const j = await res.json();
  if(!j.ok){ if(String(j.error).indexOf('인증 실패')>=0){ try{localStorage.removeItem('tok');}catch(e){} } throw new Error(j.error); }
  return j.data;
}

const $ = id => document.getElementById(id);
const MAX_SEC = 360;
let phase = 'idle';           // idle | photo | recording  (처리는 별도 큐에서 진행)
let img = null, recorder = null, chunks = [], stream = null, tick = null, startedAt = 0;
let seq = 0; const jobs = [];

function msg(t, isErr){ const m=$('msg'); m.textContent=t||''; m.className='msg'+(isErr?' err':''); }
function show(id){ ['main','list','detail'].forEach(x=>$(x).classList.toggle('hide',x!==id)); }
function hhmm(){ const d=new Date(); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }

function render(){
  $('b1').disabled = !(phase==='idle' || phase==='photo');
  $('b2').disabled = phase!=='photo';
  $('b3').disabled = phase!=='recording';
  $('b4').disabled = phase==='recording';
  $('who').className = 'who' + (phase==='recording' ? ' rec' : (phase==='photo' ? ' on' : ''));
  $('whoText').textContent = phase==='recording' ? '녹음 중' : (phase==='photo' ? '접수증 촬영됨' : '접수증을 촬영하세요');
  $('whoSub').textContent = phase==='photo' ? 'CONSULT 시작을 누르세요' : '';
  $('thumb').style.display = img ? 'block' : 'none';
}

/* ---------- 접수증 촬영: 서버 호출 없이 바로 다음 단계 ---------- */
$('b1').onclick = () => $('file').click();
$('file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f) return;
  try{
    img = await shrink(f);
    $('thumb').src = 'data:image/jpeg;base64,' + img;
    phase = 'photo'; msg(''); render();
  }catch(er){ msg('사진 처리 실패: '+er.message, true); }
};
function shrink(file){
  return new Promise((res, rej) => {
    const im = new Image(), url = URL.createObjectURL(file);
    im.onload = () => {
      const s = Math.min(1, 1280/Math.max(im.width,im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*s); c.height = Math.round(im.height*s);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg',0.8).split(',')[1]);
    };
    im.onerror = () => rej(new Error('이미지 로드 실패'));
    im.src = url;
  });
}

/* ---------- CONSULT 시작 ---------- */
$('b2').onclick = async () => {
  if(!navigator.mediaDevices || !window.MediaRecorder){ msg('이 브라우저에서는 녹음을 쓸 수 없습니다.', true); return; }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
  }catch(er){ msg('마이크를 열 수 없습니다 ['+er.name+']. 마이크 권한을 확인하세요.', true); return; }
  chunks = [];
  recorder = new MediaRecorder(stream);
  recorder.ondataavailable = ev => { if(ev.data.size) chunks.push(ev.data); };
  recorder.onstop = onStopped;
  recorder.start(1000);
  startedAt = Date.now();
  phase = 'recording'; msg(''); render();
  tick = setInterval(() => {
    const s = Math.floor((Date.now()-startedAt)/1000);
    $('whoSub').textContent = Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
    if(s >= MAX_SEC) stopRec();
  }, 500);
};

/* ---------- CONSULT 종료: 작업을 큐에 넣고 즉시 다음 환자 준비 ---------- */
$('b3').onclick = stopRec;
function stopRec(){
  if(!recorder || recorder.state==='inactive') return;
  clearInterval(tick);
  recorder.stop();
  stream.getTracks().forEach(t=>t.stop());
}
function onStopped(){
  const j = { id:++seq, img:img, blob:new Blob(chunks,{type:recorder.mimeType||'audio/webm'}), time:hhmm(), state:'run', text:'처리 중…', wav:null };
  jobs.push(j);
  img = null; phase = 'idle'; msg(''); render();
  runJob(j);
}

async function runJob(j){
  j.state = 'run'; j.text = '처리 중…'; renderJobs();
  try{
    if(!j.wav) j.wav = await toWav16k(j.blob);
    const r = await apiCall('processConsult', [j.img, 'image/jpeg', j.wav, 'audio/wav', j.time]);
    j.state = 'ok'; j.text = '✓ '+r.name+' 저장됨'; j.blob = null; j.wav = null; j.img = null;
    renderJobs();
    setTimeout(()=>{ const i=jobs.indexOf(j); if(i>=0) jobs.splice(i,1); renderJobs(); }, 12000);
  }catch(er){
    j.state = 'err'; j.text = '⚠ 실패: '+er.message; renderJobs();
  }
}
function renderJobs(){
  const box = $('jobs'); box.textContent = '';
  jobs.forEach(j => {
    const d = document.createElement('div'); d.className = 'job '+j.state;
    const t = document.createElement('span'); t.className='t'; t.textContent = j.time;
    const x = document.createElement('span'); x.className='x'; x.textContent = j.text;
    d.append(t,x);
    if(j.state==='err'){
      const b = document.createElement('button'); b.textContent='재시도'; b.onclick=()=>runJob(j); d.appendChild(b);
    }
    box.appendChild(d);
  });
}
window.addEventListener('beforeunload', e => {
  if(jobs.some(j=>j.state!=='ok')){ e.preventDefault(); e.returnValue=''; }
});

/* 녹음 → 16kHz 모노 WAV → base64 */
async function toWav16k(blob){
  const ac = new (window.AudioContext||window.webkitAudioContext)();
  const dec = await ac.decodeAudioData(await blob.arrayBuffer());
  ac.close();
  const oc = new OfflineAudioContext(1, Math.ceil(dec.duration*16000), 16000);
  const src = oc.createBufferSource(); src.buffer = dec; src.connect(oc.destination); src.start();
  const f32 = (await oc.startRendering()).getChannelData(0);
  const n = f32.length, v = new DataView(new ArrayBuffer(44+n*2));
  const w = (o,t)=>{ for(let i=0;i<t.length;i++) v.setUint8(o+i,t.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,16000,true); v.setUint32(28,32000,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f32[i])); v.setInt16(44+i*2, x<0?x*0x8000:x*0x7FFF, true); }
  return new Promise((res,rej)=>{
    const r = new FileReader();
    r.onload = () => res(r.result.split(',')[1]);
    r.onerror = () => rej(new Error('변환 실패'));
    r.readAsDataURL(new Blob([v],{type:'audio/wav'}));
  });
}

/* ---------- 내역 보기 ---------- */
$('b4').onclick = () => {
  show('list'); $('items').textContent = '불러오는 중…';
  apiCall('getList',[]).then(rows => {
    const box = $('items'); box.textContent = '';
    if(!rows.length){ box.textContent = '오늘 저장된 상담이 없습니다.'; return; }
    rows.forEach((r,i) => {
      const b = document.createElement('button'); b.className = 'item';
      const n = document.createElement('span'); n.className='n'; n.textContent = i+1;
      const nm = document.createElement('span'); nm.textContent = r.name;
      const t = document.createElement('span'); t.className='t'; t.textContent = r.time;
      b.append(n,nm,t);
      b.onclick = () => openDetail(r.row);
      box.appendChild(b);
    });
  }).catch(er => { $('items').textContent = '불러오지 못했습니다: '+er.message; });
};
function openDetail(row){
  show('detail'); $('dName').textContent=''; $('dText').textContent='불러오는 중…';
  apiCall('getDetail',[row]).then(d => { $('dName').textContent = d.name; $('dText').textContent = d.text; })
    .catch(er => { $('dText').textContent = er.message; });
}
$('back1').onclick = () => show('main');
$('back2').onclick = () => show('list');

render();
</script>
</body>
</html>
